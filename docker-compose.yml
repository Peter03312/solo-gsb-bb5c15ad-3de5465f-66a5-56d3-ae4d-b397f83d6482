services:
  exam-api:
    build: .
    image: exam-paper-api:latest
    ports:
      - "8000:8000"
    environment:
      # SQLite 数据库文件路径（容器内路径）；可按需修改
      EXAM_DB_PATH: /data/exam.db
    volumes:
      - exam_data:/data
    restart: unless-stopped
    healthcheck:
      # 依赖已内置镜像，uvicorn 冷启动通常 2~3 秒即可应答；start_period 内的
      # 探测失败不计入 retries，避免冷启动抖动被误判 unhealthy
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 10s
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  exam_data:
